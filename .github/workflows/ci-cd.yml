name: CI/CD Pipeline

# GitHub -> Build -> Automated Testing -> Code Quality -> Deployment (artifact + smoke test)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- Stage 1-3: checkout, Java 21 + Maven cache, build the executable JAR ----------
  build:
    name: "1. Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (with Maven dependency cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build executable JAR (tests run in the next job)
        run: mvn -B -ntp clean package -DskipTests

      - name: Check the JAR exists
        run: ls -l target/student-management-system.jar

      - name: Upload JAR for later stages
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/student-management-system.jar
          if-no-files-found: error

  # ---------- Stage 4: automated tests (JUnit 5) ----------
  test:
    name: "2. Automated Tests"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (with Maven dependency cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit and integration tests
        run: mvn -B -ntp test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  # ---------- Stage 5: code quality (Checkstyle) ----------
  quality:
    name: "3. Code Quality (Checkstyle)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (with Maven dependency cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Checkstyle (fails on any violation)
        run: mvn -B -ntp checkstyle:check

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          if-no-files-found: warn

  # ---------- Stage 6: publish the verified JAR and prove it starts ----------
  deploy:
    name: "4. Publish Artifact + Smoke Test"
    runs-on: ubuntu-latest
    needs: [test, quality]
    # Only trusted runs: never on pull requests, only on the main branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository (for the smoke-test script)
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download the verified JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Start the JAR on the runner and smoke-test the API
        run: bash scripts/smoke-test.sh target/student-management-system.jar

      - name: Publish release artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-management-system-release
          path: target/student-management-system.jar
          retention-days: 30
          if-no-files-found: error
